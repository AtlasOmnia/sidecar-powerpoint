<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sidecar for PowerPoint</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="theme-bootstrap.js"></script><link rel="stylesheet" href="omnia-tokens.css"/><link rel="stylesheet" href="omnia-pane.css"/><link rel="stylesheet" href="taskpane.css"/><script defer="defer" src="taskpane.cb5dfc4e0cb61253bff1.js"></script></head><body><main class="app-shell"><header class="topbar"><div class="header-main"><img class="brand-mark" src="assets/icon-32.png" width="24" height="24" alt="Omnia"/><h1>Sidecar for PowerPoint</h1><button id="settings-button" class="icon-button" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 4 .7-2h3.6l.7 2 2 .9 2.1-.4 1.8 3.1-1.4 1.6.2 2.3 1.4 1.6-1.8 3.1-2.1-.4-2 .9-.7 2h-3.6l-.7-2-2-.9-2.1.4-1.8-3.1L5 13.5l-.2-2.3-1.4-1.6 1.8-3.1 2.1.4z"/><circle cx="12" cy="11" r="3"/></svg></button></div><div class="header-status"><p id="connection-status">Waiting for PowerPoint</p><span id="privacy-badge" class="privacy-badge privacy-local" title="Privacy routing"></span></div></header><section class="bridge-strip" aria-live="polite"><div class="bridge-copy"><span id="bridge-status" class="bridge-status bridge-disconnected">Office bridge connecting</span> <code id="bridge-session-id" class="bridge-session-id"></code></div><button id="copy-bridge-session" class="bridge-copy-button" type="button" disabled="disabled">Copy session ID</button></section><section id="desk-connect" class="desk-connect" aria-live="polite"><p id="desk-connect-text">Looking for Hermes on this computer…</p><p id="desk-connect-code" class="desk-connect-code" hidden></p><button id="desk-connect-button" class="primary-button" type="button" disabled="disabled">Connect to Hermes</button></section><section id="messages" class="messages" aria-live="polite"></section><div id="checkpoint-bar" class="checkpoint-bar hidden"><span>Hermes has been working for 30 seconds.</span><div><button id="checkpoint-stop" class="secondary-button" type="button">Stop</button><button id="checkpoint-continue" class="primary-button" type="button">Continue</button></div></div><footer class="composer"><div class="composer-box"><textarea id="prompt-input" rows="3" placeholder="Ask Hermes to edit this presentation"></textarea><div class="composer-actions"><button id="stop-button" class="secondary-button" type="button" disabled="disabled">Stop</button> <button id="send-button" class="primary-button" type="button">Send</button></div></div></footer></main><dialog id="settings-dialog" class="settings-dialog"><form method="dialog" class="settings-panel"><header><h2>Settings</h2><button id="close-settings-button" class="icon-button" value="cancel" type="submit" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="settings-content"><fieldset class="theme-group"><legend>Palette</legend><div class="palette-options" role="radiogroup" aria-label="Palette"><button type="button" role="radio" aria-checked="true" data-set-palette="teal" class="palette-option"><span class="swatch" data-palette="teal" data-scheme="dark" aria-hidden="true"></span>Teal</button> <button type="button" role="radio" aria-checked="false" data-set-palette="blue" class="palette-option"><span class="swatch" data-palette="blue" data-scheme="dark" aria-hidden="true"></span>Blue</button> <button type="button" role="radio" aria-checked="false" data-set-palette="gold" class="palette-option"><span class="swatch" data-palette="gold" data-scheme="dark" aria-hidden="true"></span>Gold</button> <button type="button" role="radio" aria-checked="false" data-set-palette="red" class="palette-option"><span class="swatch" data-palette="red" data-scheme="dark" aria-hidden="true"></span>Red</button></div></fieldset><fieldset class="theme-group"><legend>Appearance</legend><div class="appearance-options" role="radiogroup" aria-label="Appearance"><button type="button" role="radio" aria-checked="true" data-set-mode="auto">Auto</button> <button type="button" role="radio" aria-checked="false" data-set-mode="dark">Dark</button> <button type="button" role="radio" aria-checked="false" data-set-mode="light">Light</button></div><p class="theme-hint">Auto follows Office, or your system when Office is unavailable.</p></fieldset><p>Hermes bridge: <code id="bridge-url">not found</code></p><label>Model <input id="model-input" autocomplete="off" spellcheck="false"/></label> <label>Max agent iterations <input id="max-iterations-input" type="number" min="1" max="20" step="1"/></label></div><menu><button id="save-settings-button" class="primary-button" value="default" type="submit">Save</button></menu></form></dialog></body></html>
